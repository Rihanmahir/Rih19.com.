<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIHAN GAMING 🎮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#070711;color:#fff}
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 7%;background:rgba(8,8,20,.96);border-bottom:1px solid #29294a}
.logo{font-size:25px;font-weight:bold;letter-spacing:2px}
nav a{color:#fff;text-decoration:none;margin-left:25px;font-weight:bold}
nav a:hover{color:#00e5ff}
.hero{min-height:520px;display:flex;justify-content:center;align-items:center;text-align:center;padding:40px 20px;background:radial-gradient(circle at top,#27275f,transparent 55%),#070711}
.status{display:inline-block;padding:10px 20px;border:1px solid #00e5ff;border-radius:30px;color:#00e5ff;background:#101025;margin-bottom:25px}
.hero h1{font-size:clamp(50px,10vw,100px);letter-spacing:5px}
.hero h1 span{color:#00e5ff}
.hero p{margin-top:20px;font-size:20px;color:#bdbdd5}
section{padding:70px 7%}
.title{text-align:center;font-size:40px;margin-bottom:45px}
.socials{display:grid;grid-template-columns:repeat(2,1fr);gap:30px;max-width:850px;margin:auto}
.social-button{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-decoration:none;color:#fff;background:linear-gradient(145deg,#15152c,#0d0d1b);border:1px solid #29294a;border-radius:30px;transition:.3s}
.social-button:hover{transform:translateY(-8px) scale(1.02);border-color:#00e5ff;box-shadow:0 10px 40px rgba(0,229,255,.15)}
.social-icon{width:90px;height:90px;display:flex;justify-content:center;align-items:center;border-radius:25px;font-size:48px;margin-bottom:20px}
.youtube{background:#f00}
.tiktok{background:#111;border:2px solid #fff}
.social-button h3{font-size:28px}
.social-button p{margin-top:8px;color:#aaaac2}
footer{text-align:center;padding:35px;background:#040409;color:#8888a5}
footer strong{color:#fff;font-size:20px}
@media(max-width:600px){
nav{padding:15px 5%}.logo{font-size:18px}nav a{margin-left:10px;font-size:13px}
.hero{min-height:450px}.hero h1{font-size:48px}.hero p{font-size:17px}
.socials{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>
  <div class="logo">🎮 RIHAN GAMING</div>
  <div><a href="#socials">📱 Socials</a></div>
</nav>

<header class="hero">
  <div>
    <div class="status">🟢 GAMER ONLINE</div>
    <h1>RIHAN <span>GAMING</span></h1>
    <p>Welcome to my gaming world! 🎮🔥<br>Follow me and stay connected.</p>
  </div>
</header>

<section id="socials">
  <h2 class="title">📱 FOLLOW ME</h2>
  <div class="socials">
    <a class="social-button" href="https://youtube.com/@officialrihan-x2h" target="_blank" rel="noopener noreferrer">
      <div class="social-icon youtube">▶</div>
      <h3>YouTube</h3>
      <p>@officialrihan-x2h</p>
    </a>

    <a class="social-button" href="https://www.tiktok.com/@officialrihan8?_r=1&_t=ZS-99YneHgKawB" target="_blank" rel="noopener noreferrer">
      <div class="social-icon tiktok">♪</div>
      <h3>TikTok</h3>
      <p>@officialrihan8</p>
    </a>
  </div>
</section>

<footer>
  <strong>🎮 RIHAN GAMING</strong><br><br>
  Gaming • Videos • Fun<br><br>
  © 2026 Rihan Gaming
</footer>
</body>
</html>
